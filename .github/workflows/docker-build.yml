name: Build and Push Docker Image

on:
  push:
    branches:
      - develop

env:
  FRAPPE_PATH: https://github.com/frappe/frappe
  FRAPPE_BRANCH: version-15
  PYTHON_VERSION: 3.11.9
  NODE_VERSION: 20.19.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image version
        id: vars
        run: |
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg=FRAPPE_PATH=$FRAPPE_PATH \
            --build-arg=FRAPPE_BRANCH=$FRAPPE_BRANCH \
            --build-arg=PYTHON_VERSION=$PYTHON_VERSION \
            --build-arg=NODE_VERSION=$NODE_VERSION \
            --build-arg=APPS_JSON_BASE64=${{ secrets.APPS_JSON_BASE64 }} \
            --tag=${{ secrets.DOCKER_USERNAME }}/custom:${{ steps.vars.outputs.VERSION }} \
            --file=images/custom/Containerfile .

      - name: Push Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/custom:${{ steps.vars.outputs.VERSION }}
